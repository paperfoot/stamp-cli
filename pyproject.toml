[project]
name = "stamp-cli"
version = "0.3.2"
description = "Create signature graphics, bilingual company seals, and office stamps as print-ready PNG and SVG files."
readme = "README.md"
authors = [{ name = "Boris Djordjevic" }, { name = "Paperfoot" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0,<9",
    "pillow>=12.3.0,<13",
    "resvg-py>=0.5.0,<0.6",
    # Read a font file's real OpenType family name (and probe glyph coverage).
    # resvg matches on that family under skip_system_fonts, so path/fc-match
    # font resolution is unreliable without it.
    "fonttools>=4.65.0,<5",
]
keywords = ["signature-generator", "stamp-generator", "company-seal", "png", "svg", "chinese", "hong-kong", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/paperfoot/stamp-cli"
Repository = "https://github.com/paperfoot/stamp-cli"
Documentation = "https://github.com/paperfoot/stamp-cli/blob/main/docs/usage.md"
Issues = "https://github.com/paperfoot/stamp-cli/issues"
Changelog = "https://github.com/paperfoot/stamp-cli/releases"

[project.scripts]
stamp = "stamp_cli.cli:cli"
stamp-cli = "stamp_cli.cli:cli"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]
