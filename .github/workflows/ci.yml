name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-latest
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            fontconfig \
            fonts-arphic-ukai \
            fonts-arphic-uming \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-noto-cjk

      - name: Install project
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Fetch optional symbol fonts
        run: uv run stamp fonts --fetch

      - name: Run tests
        run: uv run python -m pytest -q

      - name: Build distributions
        run: uv build
